name: Update Premier League Table

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Get standings
        run: |
          curl --fail -H "X-Auth-Token: ${{ secrets.FOOTBALL_DATA_TOKEN }}" \
          https://api.football-data.org/v4/competitions/PL/standings \
          -o standings.json

      - name: Save standings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add standings.json
          git commit -m "Update Premier League table" || echo "No changes"
          git push
